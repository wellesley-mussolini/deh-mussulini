name: Site

on:
  pull_request:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Em PR, um push novo torna a verificação anterior inútil; na prod, um deploy em andamento termina.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

      - if: github.ref == 'refs/heads/prod'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/prod'
    needs: verificar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
